<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS & Inventory - ประวัติเบิกออก / ตัดสต็อก</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main); 
            margin: 0; 
            padding: 30px 20px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 30px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section { 
            margin-bottom: 20px; 
        }

        .nav-links { 
            margin-bottom: 30px; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }
        
        .nav-links a { 
            background: #334155; 
            color: white; 
            padding: 9px 14px; 
            text-decoration: none; 
            border-radius: var(--radius); 
            font-size: 13px; 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .nav-links a:hover { background: #1e293b; }
        .nav-links a.active { background: var(--warning); }

        /* Controls & Search */
        .controls-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 12px; 
            flex-wrap: wrap; 
        }
        
        .search-group, .per-page-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box { 
            padding: 9px 14px; 
            width: 280px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            font-size: 14px; 
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--primary); }

        .per-page-select { 
            padding: 9px 12px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            font-size: 14px; 
            font-family: 'Inter', sans-serif;
            background: #fff; 
            outline: none;
            cursor: pointer;
        }
        .per-page-select:focus { border-color: var(--primary); }

        /* Tables Styling */
        .table-container { 
            width: 100%; 
            overflow-x: auto; 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            background: #fff; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }
        
        th, td { 
            padding: 12px 16px; 
            font-size: 14px; 
            border-bottom: 1px solid var(--border); 
            vertical-align: middle; 
        }
        
        th { 
            background: #f8fafc; 
            font-weight: 600; 
            color: var(--text-muted); 
        }
        
        tr:last-child td { border-bottom: none; }
        
        tr { transition: background 0.15s; }
        tr:hover { background: #f8fafc; }

        /* Pagination */
        .pagination-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 20px; 
            font-size: 14px; 
            color: var(--text-muted);
        }
        
        .pagination-btns { 
            display: flex; 
            gap: 8px; 
            align-items: center;
        }
        
        .page-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: var(--radius); 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .page-btn:hover:not(:disabled) { background: var(--primary-hover); }
        .page-btn:disabled { background: #cbd5e1; cursor: not-allowed; color: #94a3b8; }
        
        #currentPageDisplay {
            padding: 6px 12px;
            font-weight: 600;
            background: #f1f5f9;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fa-solid fa-arrow-up-from-bracket" style="color: var(--warning);"></i> ประวัติการเบิกออก / ตัดสต็อก</h1>
    
    <!-- Navigation -->
    <div class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> แดชบอร์ด</a>
        <a href="ingredients.html"><i class="fa-solid fa-box"></i> จัดการวัตถุดิบ & รับเข้า</a>
        <a href="products.html"><i class="fa-solid fa-mug-hot"></i> จัดการเมนูสินค้า</a>
        <a href="recipes.html"><i class="fa-solid fa-flask"></i> ผูกสูตรชง</a>
        <a href="history-in.html" style="background:#059669;"><i class="fa-solid fa-arrow-down-to-bracket"></i> ประวัติรับเข้า</a>
        <a href="history-out.html" class="active"><i class="fa-solid fa-arrow-up-from-bracket"></i> ประวัติเบิกออก</a>
    </div>

    <div class="section">
        <div class="controls-bar">
            <div class="search-group">
                <label for="searchInput" style="font-size: 13px; font-weight: 600; color: var(--text-muted);"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา:</label>
                <input type="text" id="searchInput" class="search-box" placeholder="พิมพ์ชื่อวัตถุดิบ หรือวันที่..." oninput="handleSearch()">
            </div>
            <div class="per-page-group">
                <label for="perPageSelect" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">แสดง:</label>
                <select id="perPageSelect" class="per-page-select" onchange="changePerPage()">
                    <option value="10">10 รายการ</option>
                    <option value="20" selected>20 รายการ</option>
                    <option value="50">50 รายการ</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">วันที่/เวลา</th>
                        <th style="width: 40%;">ชื่อวัตถุดิบ</th>
                        <th style="width: 15%;">จำนวนที่เบิกออก</th>
                        <th style="width: 15%;">หน่วย</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 40px;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-bar">
            <div id="pageInfo" class="page-info">แสดง 0 ถึง 0 จาก 0 รายการ</div>
            <div class="pagination-btns">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i> ก่อนหน้า</button>
                <span id="currentPageDisplay">1 / 1</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">ถัดไป <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    let itemsPerPage = 20;

    function loadHistoryOut() {
        try {
            // ดึงข้อมูลประวัติเบิกออกจาก localStorage (หากยังไม่มีให้ใช้ Array ว่าง)
            const storedData = localStorage.getItem('coffee_history_out');
            allData = storedData ? JSON.parse(storedData) : [];
            
            if (!Array.isArray(allData)) allData = [];
            
            // เรียงลำดับจากล่าสุดไปเก่าสุด
            allData.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
            
            filterAndRender();
        } catch (error) {
            console.error('โหลดประวัติไม่สำเร็จ:', error);
            Swal.fire({
                icon: 'error',
                title: 'เกิดข้อผิดพลาด',
                text: 'ไม่สามารถโหลดข้อมูลประวัติเบิกออกได้',
                confirmButtonColor: '#2563eb'
            });
        }
    }

    function handleSearch() {
        currentPage = 1;
        filterAndRender();
    }

    function changePerPage() {
        itemsPerPage = parseInt(document.getElementById('perPageSelect').value);
        currentPage = 1;
        filterAndRender();
    }

    function filterAndRender() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

        // กรองข้อมูลตามคำค้นหา
        filteredData = allData.filter(item => {
            const dateStr = new Date(item.createdAt || item.date).toLocaleString('th-TH').toLowerCase();
            const ingName = (item.Ingredient ? item.Ingredient.name : (item.ingredientName || '')).toLowerCase();
            const qtyVal = item.quantity !== undefined ? item.quantity : (item.amount !== undefined ? item.amount : '');
            const qtyStr = String(qtyVal).toLowerCase();
            const unitStr = (item.Ingredient ? item.Ingredient.unit : (item.unit || '')).toLowerCase();

            return dateStr.includes(keyword) || ingName.includes(keyword) || qtyStr.includes(keyword) || unitStr.includes(keyword);
        });

        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = '';

        const totalItems = filteredData.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageItems = filteredData.slice(startIndex, endIndex);

        if (totalItems === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 40px;">ไม่พบข้อมูลประวัติการเบิกออก</td></tr>';
        } else {
            pageItems.forEach(item => {
                const dateFormatted = new Date(item.createdAt || item.date).toLocaleString('th-TH');
                const ingName = item.Ingredient ? item.Ingredient.name : (item.ingredientName || 'ไม่ระบุ');
                const unit = item.Ingredient ? item.Ingredient.unit : (item.unit || '');
                const qty = item.quantity !== undefined ? item.quantity : (item.amount !== undefined ? item.amount : 0);

                tbody.innerHTML += `
                    <tr>
                        <td style="color: var(--text-muted); font-size: 13px;">
                            <i class="fa-regular fa-clock" style="margin-right: 4px;"></i> ${dateFormatted}
                        </td>
                        <td>
                            <span style="font-weight: 600; color: var(--text-main);"><i class="fa-solid fa-box" style="color: var(--warning); margin-right: 6px;"></i> ${ingName}</span>
                        </td>
                        <td>
                            <span style="color: var(--danger); font-weight: 700; background: #fef2f2; padding: 4px 8px; border-radius: 6px; display: inline-block;">-${qty}</span>
                        </td>
                        <td style="color: var(--text-muted);">${unit}</td>
                    </tr>`;
            });
        }

        // อัปเดตส่วนปุ่มเปลี่ยนหน้า
        const startNum = totalItems === 0 ? 0 : startIndex + 1;
        const endNum = Math.min(endIndex, totalItems);
        document.getElementById('pageInfo').innerText = `แสดง ${startNum} ถึง ${endNum} จากทั้งหมด ${totalItems} รายการ`;
        document.getElementById('currentPageDisplay').innerText = `${currentPage} / ${totalPages}`;
        
        document.getElementById('prevBtn').disabled = (currentPage === 1);
        document.getElementById('nextBtn').disabled = (currentPage === totalPages || totalPages === 0);
    }

    function changePage(direction) {
        currentPage += direction;
        renderTable();
    }

    loadHistoryOut();
</script>
</body>
</html>
