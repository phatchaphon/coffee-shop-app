<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">POS & Inventory</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); margin: 0; padding: 32px 16px; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--card-bg); padding: 36px; border-radius: var(--radius); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .header-title { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .header-icon { background: #eef2ff; color: var(--primary); width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 26px; }
        h1 { color: var(--text-main); font-size: 28px; font-weight: 700; margin: 0; }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .nav-links a { background: #f8fafc; color: var(--text-muted); padding: 10px 18px; text-decoration: none; border-radius: 10px; font-size: 14px; font-weight: 600; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); }
        .nav-links a:hover { background: #f1f5f9; color: var(--text-main); }
        .nav-links a.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3); }
        /* ใส่ CSS ดีไซน์อื่นๆ เพิ่มเติมตรงนี้ได้ตามต้องการ */
    </style>
</head>
<body>
<div class="container">
    <div class="header-title">
        <div class="header-icon" id="layout-icon">☕</div>
        <div>
            <h1 id="layout-heading">แดชบอร์ดภาพรวมร้าน</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 14px;" id="layout-subtext">ระบบบริหารจัดการสต็อกวัตถุดิบและยอดขายประจำวัน</p>
        </div>
    </div>
    
    <!-- Navigation กลาง -->
    <div class="nav-links">
        <a href="index.html" id="nav-index">🏠 แดชบอร์ด</a>
        <a href="ingredients.html" id="nav-ingredients">📦 จัดการวัตถุดิบ & รับเข้า</a>
        <a href="products.html" id="nav-products">☕ จัดการเมนูสินค้า</a>
        <a href="recipes.html" id="nav-recipes">🧪 ผูกสูตรชง</a>
        <a href="history-in.html" id="nav-history-in">📥 ประวัติรับเข้า</a>
        <a href="history-out.html" id="nav-history-out">📤 ประวัติเบิกออก</a>
    </div>

    <!-- จุดที่จะเอาเนื้อหาเฉพาะของแต่ละหน้ามาใส่ -->
    <div id="app-content"></div>
</div>
</body>
</html>
