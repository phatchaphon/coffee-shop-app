<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS & Inventory - จัดการสูตรชง</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main); 
            margin: 0; 
            padding: 30px 20px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 30px; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 { 
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main); 
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section { 
            margin-bottom: 30px; 
        }

        .section-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            flex-wrap: wrap;
            gap: 12px;
        }

        /* ตารางตัวควบคุมการแสดงผลและค้นหา */
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .entries-control, .search-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .entries-control select, .search-control input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .entries-control select:focus, .search-control input:focus {
            border-color: var(--primary);
        }

        .search-control input {
            width: 240px;
        }

        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            border-radius: var(--radius); 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }
        
        .btn-outline { 
            background: #ffffff; 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }
        .btn-outline:hover { 
            background: #f1f5f9; 
            border-color: #cbd5e1; 
        }

        .nav-links { 
            margin-bottom: 30px; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }
        
        .nav-links a { 
            background: #334155; 
            color: white; 
            padding: 9px 14px; 
            text-decoration: none; 
            border-radius: var(--radius); 
            font-size: 13px; 
            font-weight: 600; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .nav-links a:hover { background: #1e293b; }
        .nav-links a.active { background: var(--primary); }

        /* Tables Styling */
        .table-container { 
            width: 100%; 
            overflow-x: auto; 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            background: #fff; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }
        
        th, td { 
            padding: 12px 16px; 
            font-size: 14px; 
            border-bottom: 1px solid var(--border); 
            vertical-align: middle; 
        }
        
        th { 
            background: #f8fafc; 
            font-weight: 600; 
            color: var(--text-muted); 
        }
        
        tr:last-child td { border-bottom: none; }
        
        tr { transition: background 0.15s; }
        tr:hover { background: #f8fafc; }

        /* Pagination Styling */
        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 12px;
        }

        .pagination {
            display: flex;
            gap: 4px;
        }

        .pagination button {
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
        }

        .pagination button:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Badge สำหรับแสดงวัตถุดิบในสูตร */
        .badge { 
            background: #eff6ff; 
            color: var(--primary); 
            border: 1px solid #dbeafe; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 500; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            margin: 2px 4px 2px 0; 
        }

        /* Custom Searchable Select Styling */
        .searchable-select-wrapper {
            position: relative;
            flex: 2;
        }
        .searchable-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        .searchable-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .searchable-dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            box-shadow: var(--shadow);
            margin-top: 2px;
        }
        .searchable-dropdown-item {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .searchable-dropdown-item:hover {
            background: #f1f5f9;
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fa-solid fa-flask" style="color: var(--primary);"></i> จัดการสูตรชง (Recipes)</h1>
    
    <!-- Navigation -->
    <div class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> แดชบอร์ด</a>
        <a href="ingredients.html"><i class="fa-solid fa-box"></i> จัดการวัตถุดิบ & รับเข้า</a>
        <a href="products.html"><i class="fa-solid fa-mug-hot"></i> จัดการเมนูสินค้า</a>
        <a href="recipes.html" class="active"><i class="fa-solid fa-flask"></i> ผูกสูตรชง</a>
        <a href="history-in.html" style="background:#059669;"><i class="fa-solid fa-arrow-down-to-bracket"></i> ประวัติรับเข้า</a>
        <a href="history-out.html" style="background:#d97706;"><i class="fa-solid fa-arrow-up-from-bracket"></i> ประวัติเบิกออก</a>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fa-solid fa-list-check" style="color: var(--primary);"></i> รายการสูตรชงของแต่ละเมนู</h2>
            <button onclick="openAddRecipeModal()"><i class="fa-solid fa-plus"></i> กำหนด/แก้ไขสูตรชง</button>
        </div>

        <!-- ชุดเครื่องมือควบคุมการแสดงผล (Pagination & Search) -->
        <div class="table-controls">
            <div class="entries-control">
                แสดง
                <select id="itemsPerPageSelect" onchange="changeItemsPerPage()">
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                รายการต่อหน้า
            </div>
            <div class="search-control">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อเมนูหรือวัตถุดิบ..." oninput="handleSearch()">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">เมนูสินค้า</th>
                        <th style="width: 60%;">วัตถุดิบที่ใช้ต่อ 1 แก้ว</th>
                        <th style="width: 15%; text-align: center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="recipesTableBody">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px;">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- ส่วนท้ายตาราง แสดงจำนวนและปุ่มเปลี่ยนหน้า -->
        <div class="table-footer">
            <div id="tableInfo">แสดง 0 ถึง 0 จาก 0 รายการ</div>
            <div class="pagination" id="paginationContainer">
                <!-- ปุ่มเปลี่ยนหน้าจะถูกสร้างที่นี่ -->
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000';
    let allIngredients = [];
    let allProducts = [];
    let allRecipes = [];

    // ตัวแปรสำหรับระบบ Pagination & Search
    let currentPage = 1;
    let itemsPerPage = 10;
    let searchQuery = '';

    async function loadRecipesData() {
        try {
            const [prodRes, ingRes, recipeRes] = await Promise.all([
                fetch(`${API_URL}/api/products`),
                fetch(`${API_URL}/api/ingredients`),
                fetch(`${API_URL}/api/recipes`)
            ]);

            allProducts = await prodRes.json();
            allIngredients = await ingRes.json();
            allRecipes = recipeRes.ok ? await recipeRes.json() : [];

            renderTable();
        } catch (error) {
            console.error('โหลดข้อมูลไม่สำเร็จ:', error);
            Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', 'error');
        }
    }

    // ฟังก์ชันจัดการการแสดงผลตารางตามหน้าและคำค้นหา
    function renderTable() {
        const tbodyEl = document.getElementById('recipesTableBody');
        tbodyEl.innerHTML = '';

        if (allProducts.length === 0) {
            tbodyEl.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px;">ยังไม่มีเมนูสินค้าในระบบ</td></tr>';
            document.getElementById('tableInfo').innerText = 'แสดง 0 ถึง 0 จาก 0 รายการ';
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }

        // ประมวลผลข้อมูลวัตถุดิบในแต่ละสินค้าเพื่อนำมาใช้กรอง
        const processedProducts = allProducts.map(p => {
            const productRecipes = allRecipes.filter(r => r.productId === p.id || r.ProductId === p.id);
            const recipeTexts = productRecipes.map(r => {
                const ingName = r.Ingredient ? r.Ingredient.name : (r.ingredientName || '');
                const unit = r.Ingredient ? r.Ingredient.unit : (r.unit || '');
                const qty = r.quantity !== undefined ? r.quantity : (r.amount !== undefined ? r.amount : 0);
                return `${ingName} ${qty} ${unit}`;
            }).join(' ');

            return {
                ...p,
                productRecipes,
                searchString: `${p.name} ${recipeTexts}`.toLowerCase()
            };
        });

        // กรองข้อมูลตามคำค้นหา (Search)
        const filteredProducts = processedProducts.filter(p => 
            p.searchString.includes(searchQuery.toLowerCase())
        );

        const totalItems = filteredProducts.length;
        const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        // ตัดแบ่งข้อมูลตาม Pagination
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedProducts = filteredProducts.slice(startIndex, endIndex);

        if (paginatedProducts.length === 0) {
            tbodyEl.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px;">ไม่พบข้อมูลที่ค้นหา</td></tr>';
            document.getElementById('tableInfo').innerText = `แสดง 0 ถึง 0 จาก ${totalItems} รายการ`;
            document.getElementById('paginationContainer').innerHTML = '';
            return;
        }

        paginatedProducts.forEach(p => {
            let recipeHtml = '';
            if (p.productRecipes.length === 0) {
                recipeHtml = '<span style="color: var(--text-muted); font-style: italic; font-size: 13px;">ยังไม่ได้กำหนดสูตรชง</span>';
            } else {
                recipeHtml = p.productRecipes.map(r => {
                    const ingName = r.Ingredient ? r.Ingredient.name : (r.ingredientName || 'ไม่ระบุ');
                    const unit = r.Ingredient ? r.Ingredient.unit : (r.unit || '');
                    const qty = r.quantity !== undefined ? r.quantity : (r.amount !== undefined ? r.amount : 0);
                    return `<span class="badge"><i class="fa-solid fa-box" style="font-size: 10px;"></i> ${ingName}: <strong>${qty} ${unit}</strong></span>`;
                }).join(' ');
            }

            tbodyEl.innerHTML += `
                <tr>
                    <td style="font-weight: 600; color: var(--text-main);">
                        <i class="fa-solid fa-mug-hot" style="color: var(--primary); margin-right: 6px;"></i> ${p.name}
                    </td>
                    <td>${recipeHtml}</td>
                    <td style="text-align: center;">
                        <button class="btn-outline" style="padding: 6px 12px; font-size: 13px;" onclick="openEditRecipeModal(${p.id}, '${p.name}')">
                            <i class="fa-solid fa-pen-to-square"></i> จัดการสูตร
                        </button>
                    </td>
                </tr>`;
        });

        // อัปเดตข้อความข้อมูลตาราง (Table Info)
        const displayStart = totalItems === 0 ? 0 : startIndex + 1;
        const displayEnd = Math.min(endIndex, totalItems);
        document.getElementById('tableInfo').innerText = `แสดง ${displayStart} ถึง ${displayEnd} จาก ${totalItems} รายการ`;

        // สร้างปุ่ม Pagination
        renderPagination(totalPages);
    }

    // ฟังก์ชันสร้างปุ่มตัวเลขหน้า
    function renderPagination(totalPages) {
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';

        // ปุ่ม Previous
        const prevBtn = document.createElement('button');
        prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left" style="font-size: 10px;"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        };
        container.appendChild(prevBtn);

        // แสดงเลขหน้า
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                const pageBtn = document.createElement('button');
                pageBtn.innerText = i;
                if (i === currentPage) pageBtn.className = 'active';
                pageBtn.onclick = () => {
                    currentPage = i;
                    renderTable();
                };
                container.appendChild(pageBtn);
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                const span = document.createElement('span');
                span.style.padding = '0 4px';
                span.style.display = 'flex';
                span.style.alignItems = 'center';
                span.innerText = '...';
                container.appendChild(span);
            }
        }

        // ปุ่ม Next
        const nextBtn = document.createElement('button');
        nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>';
        nextBtn.disabled = currentPage === totalPages || totalPages === 0;
        nextBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        };
        container.appendChild(nextBtn);
    }

    // ฟังก์ชันเปลี่ยนจำนวนรายการต่อหน้า
    function changeItemsPerPage() {
        itemsPerPage = parseInt(document.getElementById('itemsPerPageSelect').value);
        currentPage = 1;
        renderTable();
    }

    // ฟังก์ชันค้นหาข้อมูล
    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        currentPage = 1;
        renderTable();
    }

    // ฟังก์ชันสร้างแถววัตถุดิบพร้อมระบบพิมพ์ค้นหาได้ (Searchable Select)
    window.addIngredientRow = function(containerId = 'recipe-rows-container') {
        const container = document.getElementById(containerId);
        if (!container) return;

        const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 5);
        const rowDiv = document.createElement('div');
        rowDiv.className = 'recipe-row';
        rowDiv.style.cssText = 'display: flex; gap: 8px; margin-bottom: 8px; align-items: center; position: relative;';
        
        rowDiv.innerHTML = `
            <div class="searchable-select-wrapper">
                <input type="text" class="searchable-input" placeholder="พิมพ์ชื่อวัตถุดิบเพื่อค้นหา..." autocomplete="off">
                <input type="hidden" class="recipe-ing-id" value="">
                <div class="searchable-dropdown-list"></div>
            </div>
            <input type="number" class="swal2-input recipe-qty-input" placeholder="ปริมาณ" style="flex: 1; margin: 0; border-radius: 8px; height: 42px; font-family: 'Inter', sans-serif;" min="0" step="any">
            <button type="button" class="btn-danger" style="padding: 0 12px; height: 42px; border-radius: 8px; margin: 0;" onclick="document.getElementById('${rowId}').remove()">
                <i class="fa-solid fa-trash"></i>
            </button>
        `;
        container.appendChild(rowDiv);

        // ผูก Event สำหรับระบบพิมพ์ค้นหา
        const inputEl = rowDiv.querySelector('.searchable-input');
        const hiddenIdEl = rowDiv.querySelector('.recipe-ing-id');
        const dropdownEl = rowDiv.querySelector('.searchable-dropdown-list');

        function renderDropdown(filterText = '') {
            dropdownEl.innerHTML = '';
            const filtered = allIngredients.filter(i => i.name.toLowerCase().includes(filterText.toLowerCase()));
            
            if (filtered.length === 0) {
                dropdownEl.innerHTML = '<div style="padding: 8px 12px; color: var(--text-muted); font-size: 13px;">ไม่พบวัตถุดิบ</div>';
            } else {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'searchable-dropdown-item';
                    div.innerHTML = `${item.name} (${item.unit || ''})`;
                    div.onclick = () => {
                        inputEl.value = `${item.name} (${item.unit || ''})`;
                        hiddenIdEl.value = item.id;
                        dropdownEl.style.display = 'none';
                    };
                    dropdownEl.appendChild(div);
                });
            }
            dropdownEl.style.display = 'block';
        }

        inputEl.addEventListener('focus', () => {
            renderDropdown(inputEl.value);
        });

        inputEl.addEventListener('input', () => {
            hiddenIdEl.value = ''; // เคลียร์ค่า ID เก่าถ้าพิมพ์แก้
            renderDropdown(inputEl.value);
        });

        // คลิกนอก dropdown เพื่อซ่อน
        document.addEventListener('click', (e) => {
            if (!rowDiv.contains(e.target)) {
                dropdownEl.style.display = 'none';
            }
        });
    }

    async function openAddRecipeModal() {
        if (allProducts.length === 0) {
            Swal.fire('แจ้งเตือน', 'กรุณาเพิ่มเมนูก่อนกำหนดสูตร', 'warning');
            return;
        }
        
        let productOptions = allProducts.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        const { value: formValues } = await Swal.fire({
            title: '✨ กำหนดสูตรชงใหม่',
            html: `
                <div style="text-align: left; margin-bottom: 12px;">
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #1e293b;">เลือกเมนูสินค้า:</label>
                    <select id="swal-recipe-prod" class="swal2-input" style="width: 100%; margin: 0; border-radius: 8px; height: 44px; font-family: 'Inter', sans-serif;">${productOptions}</select>
                </div>
                <div style="text-align: left; margin-bottom: 8px;">
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #1e293b;">รายการวัตถุดิบที่ใช้ต่อ 1 แก้ว:</label>
                </div>
                <div id="recipe-rows-container" style="max-height: 220px; overflow-y: visible; text-align: left; margin-bottom: 12px; padding-right: 4px;">
                    <!-- แดนามิกแถวจะถูกเพิ่มที่นี่ -->
                </div>
                <button type="button" class="btn-outline" style="width: 100%; justify-content: center; padding: 8px; font-size: 13px; border-style: dashed;" onclick="addIngredientRow('recipe-rows-container')">
                    <i class="fa-solid fa-plus"></i> เพิ่มวัตถุดิบอีกรายการ
                </button>
            `,
            didOpen: () => {
                addIngredientRow('recipe-rows-container');
            },
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'บันทึกสูตรทั้งหมด',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#2563eb',
            cancelButtonColor: '#94a3b8',
            preConfirm: () => {
                const productId = document.getElementById('swal-recipe-prod').value;
                const rows = document.querySelectorAll('#recipe-rows-container .recipe-row');
                
                if (!productId) {
                    Swal.showValidationMessage('กรุณาเลือกเมนูสินค้า');
                    return false;
                }

                let items = [];
                for (let row of rows) {
                    const ingId = row.querySelector('.recipe-ing-id').value;
                    const qty = row.querySelector('.recipe-qty-input').value;
                    if (ingId && qty) {
                        items.push({
                            productId: Number(productId),
                            ingredientId: Number(ingId),
                            quantity: parseFloat(qty)
                        });
                    }
                }

                if (items.length === 0) {
                    Swal.showValidationMessage('กรุณาเลือกวัตถุดิบจากรายการค้นหาและใส่ปริมาณอย่างน้อย 1 รายการ');
                    return false;
                }

                return { productId: Number(productId), items };
            }
        });

        if (formValues) {
            try {
                let successCount = 0;
                for (let item of formValues.items) {
                    const res = await fetch(`${API_URL}/api/recipes`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                    if (res.ok) successCount++;
                }

                if (successCount > 0) {
                    Swal.fire({ icon: 'success', title: 'บันทึกสูตรสำเร็จ', showConfirmButton: false, timer: 1500 });
                    loadRecipesData();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกสูตรได้', 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('เกิดข้อผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ', 'error');
            }
        }
    }

    async function openEditRecipeModal(productId, productName) {
        const productRecipes = allRecipes.filter(r => r.productId === productId || r.ProductId === productId);
        
        let recipeItemsHtml = productRecipes.length === 0 ? '<p style="color: var(--text-muted); font-size: 14px; text-align: center; margin: 10px 0;">ยังไม่มีวัตถุดิบในสูตรนี้</p>' : 
            productRecipes.map(r => {
                const ingName = r.Ingredient ? r.Ingredient.name : (r.ingredientName || 'ไม่ระบุ');
                const unit = r.Ingredient ? r.Ingredient.unit : (r.unit || '');
                const qty = r.quantity !== undefined ? r.quantity : (r.amount !== undefined ? r.amount : 0);
                const rId = r.id || r.Id;
                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border);">
                        <span style="font-weight: 500; font-size: 14px;"><i class="fa-solid fa-box" style="color: var(--primary); margin-right: 6px;"></i> ${ingName} : <strong style="color: var(--primary);">${qty} ${unit}</strong></span>
                        <button type="button" class="btn-danger" style="padding: 5px 10px; font-size: 12px; border-radius: 6px;" onclick="deleteRecipeItem(${rId}, ${productId}, '${productName}')"><i class="fa-solid fa-trash"></i> ลบ</button>
                    </div>`;
            }).join('');

        const { value: addMore } = await Swal.fire({
            title: `📖 จัดการสูตร: ${productName}`,
            html: `
                <div style="text-align: left; max-height: 180px; overflow-y: auto; margin-bottom: 12px; padding-right: 4px;">
                    ${recipeItemsHtml}
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
                <div style="text-align: left; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #1e293b;">
                    <i class="fa-solid fa-circle-plus" style="color: var(--success);"></i> เพิ่มวัตถุดิบใหม่เข้าสูตรนี้ (เพิ่มได้หลายรายการ):
                </div>
                <div id="edit-recipe-rows-container" style="max-height: 180px; overflow-y: visible; text-align: left; margin-bottom: 10px; padding-right: 4px;">
                    <!-- แดนามิกแถวสำหรับเพิ่มใหม่ -->
                </div>
                <button type="button" class="btn-outline" style="width: 100%; justify-content: center; padding: 8px; font-size: 13px; border-style: dashed;" onclick="addIngredientRow('edit-recipe-rows-container')">
                    <i class="fa-solid fa-plus"></i> เพิ่มแถววัตถุดิบ
                </button>
            `,
            didOpen: () => {
                addIngredientRow('edit-recipe-rows-container');
            },
            showCancelButton: true,
            confirmButtonText: 'บันทึกวัตถุดิบที่เพิ่ม',
            cancelButtonText: 'ปิดหน้าต่าง',
            confirmButtonColor: '#2563eb',
            cancelButtonColor: '#94a3b8',
            preConfirm: () => {
                const rows = document.querySelectorAll('#edit-recipe-rows-container .recipe-row');
                let items = [];
                for (let row of rows) {
                    const ingId = row.querySelector('.recipe-ing-id').value;
                    const qty = row.querySelector('.recipe-qty-input').value;
                    if (ingId && qty) {
                        items.push({
                            productId: Number(productId),
                            ingredientId: Number(ingId),
                            quantity: parseFloat(qty)
                        });
                    }
                }
                return items;
            }
        });

        if (addMore && addMore.length > 0) {
            try {
                let successCount = 0;
                for (let item of addMore) {
                    const res = await fetch(`${API_URL}/api/recipes`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                    if (res.ok) successCount++;
                }

                if (successCount > 0) {
                    Swal.fire({ icon: 'success', title: 'เพิ่มวัตถุดิบสำเร็จ', showConfirmButton: false, timer: 1200 })
                        .then(() => openEditRecipeModal(productId, productName));
                    loadRecipesData();
                }
            } catch (err) {
                console.error(err);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
        }
    }

    async function deleteRecipeItem(recipeId, productId, productName) {
        const result = await Swal.fire({
            title: 'ต้องการลบวัตถุดิบนี้?',
            text: 'คุณต้องการลบวัตถุดิบนี้ออกจากสูตรใช่หรือไม่',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'ยืนยันลบ',
            cancelButtonText: 'ยกเลิก'
        });

        if (result.isConfirmed) {
            try {
                const res = await fetch(`${API_URL}/api/recipes/${recipeId}`, { method: 'DELETE' });
                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', showConfirmButton: false, timer: 1000 })
                        .then(() => openEditRecipeModal(productId, productName));
                    loadRecipesData();
                }
            } catch (err) {
                console.error(err);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถลบรายการได้', 'error');
            }
        }
    }

    loadRecipesData();
</script>
</body>
</html>
